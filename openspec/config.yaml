schema: spec-driven

context: |
  Tech stack: TypeScript strict (ESNext, verbatimModuleSyntax) on Bun 1.x — private package @openmobile/android-device-bridge v0.1.0 (MIT)
  Architecture: modular TS library — src/{device,bridge,stream,tools,plugin}; MCP server bin (src/mcp-server.ts); gRPC emulator protos in protos/
  Testing: bun test — 21 test files, golden fixtures + in-memory CLI/adb runners (test/helpers); fixture recorders in scripts/
  Style: ESM only ("type": "module"), allowImportingTsExtensions, typecheck via tsc --noEmit; no linter/formatter configured

testing:
  strict_tdd: true
  test_command: "bun test"
  note: >
    Bun runtime is scaffolded (package.json / bun.lock present), `bun test` and
    `bun run typecheck` work. strict_tdd enabled → RED-GREEN-REFACTOR active.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "bun test"
  verify:
    test_command: "bun test"
    build_command: "bun build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas