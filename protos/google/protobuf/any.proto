syntax = "proto3";
package google.protobuf;

// Minimal vendored Any stub — canonical well-known-type shape (field numbers
// follow protobuf upstream), sufficient for proto-loader to parse
// rtc_service_v2.proto. Full definitions live in the protobuf upstream repo
// (src/google/protobuf/any.proto).
message Any {
  string type_url = 1;
  bytes value = 2;
}